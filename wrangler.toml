name = "shieldpro-cloud-crew-relay"
main = "src/index.js"
compatibility_date = "2024-11-01"

[[durable_objects.bindings]]
name = "CREW_ROOMS"
class_name = "CrewRoomDurableObject"

[[r2_buckets]]
binding = "CREW_FILES"
